spring.application.name=springboot-thymeleaf-demo

# DataSource Configuration for SQL Server
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SpringBootThymeleafDemo;encrypt=true;trustServerCertificate=true
#spring.datasource.username=sa
#spring.datasource.password=123456789

# DataSource Configuration for H2 DB
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123456
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#JPA Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE