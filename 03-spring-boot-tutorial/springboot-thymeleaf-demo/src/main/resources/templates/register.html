<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container form-container">
    <form th:action="@{/register}" th:object="${userForm}" method="post">

        <div class="row mb-4">
            <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" th:field="*{firstName}" class="form-control" id="firstName">
            </div>
            <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" th:field="*{lastName}" class="form-control" id="lastName">
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <label for="email" class="form-label">User Email <span class="text-danger">*</span></label>
                <input type="email" th:field="*{email}" class="form-control" id="email" required>
            </div>
            <div class="col-md-6">
                <label for="website" class="form-label">Website</label>
                <input type="url" th:field="*{website}" class="form-control" id="website">
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <label for="password" class="form-label">User Password <span class="text-danger">*</span></label>
                <input type="password" th:field="*{password}" class="form-control" id="password" required>
            </div>
            <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control" id="confirmPassword">
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <label class="form-label d-block">Hobbies</label>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" value="Reading" id="h1" th:field="*{hobbies}">
                    <label class="form-check-label" for="h1">Reading</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" value="Gaming" id="h2" th:field="*{hobbies}">
                    <label class="form-check-label" for="h2">Gaming</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="Traveling" id="h3" th:field="*{hobbies}">
                    <label class="form-check-label" for="h3">Traveling</label>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label d-block">Gender</label>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" value="Male" id="male" th:field="*{gender}">
                    <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" value="Female" id="female" th:field="*{gender}">
                    <label class="form-check-label" for="female">Female</label>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label for="country" class="form-label">Country</label>
            <select class="form-select" id="country" th:field="*{country}">
                <option value="US">United States (US)</option>
                <option value="UK">United Kingdom (UK)</option>
                <option value="VN">Vietnam (VN)</option>
            </select>
        </div>

        <div class="mb-4">
            <label for="comments" class="form-label">Textarea</label>
            <textarea class="form-control" id="comments" th:field="*{comments}" rows="5"></textarea>
        </div>

        <button type="submit" class="btn btn-dark px-5 mt-2">Submit</button>
    </form>
</div>

</body>
</html>
