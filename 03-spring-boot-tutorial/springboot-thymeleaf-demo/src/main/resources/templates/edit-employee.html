<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Employee Management System</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h1>Employee Management System</h1>
    <hr>
    <h2>Update Employee</h2>

    <form action="#" th:action="@{/save}" th:object="${employee}" method="POST">

        <!-- Hidden field for update -->
        <input type="hidden" th:field="*{id}" />

        <!-- Full Name -->
        <div class="form-group row align-items-center">
            <div class="col-4">
                <input type="text"
                       th:field="*{fullName}"
                       class="form-control">
            </div>
            <div class="col-4">
                <span th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}"
                      class="text-warning">
                    Name Error
                </span>
            </div>
        </div>

        <!-- Email -->
        <div class="form-group row align-items-center">
            <div class="col-4">
                <input type="text"
                       th:field="*{email}"
                       class="form-control">
            </div>
            <div class="col-4">
                <span th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"
                      class="text-warning">
                    Email Error
                </span>
            </div>
        </div>

        <!-- Address -->
        <div class="form-group row">
            <div class="col-4">
                <input type="text"
                       th:field="*{address}"
                       class="form-control">
            </div>
        </div>

        <button type="submit" class="btn btn-primary col-2">
            Update Employee
        </button>
    </form>

    <hr>

    <a th:href="@{/home}"> Back to Employee List</a>
</div>
</body>
</html>
