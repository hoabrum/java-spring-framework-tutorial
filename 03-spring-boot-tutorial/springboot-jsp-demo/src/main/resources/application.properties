spring.application.name=springboot-jsp-demo
server.port=8080

spring.mvc.view.prefix= /WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Hard code for username and password
login.username=admin@gmail.com
login.password=123456

#DataSource Configuration for SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SpringBootJspDemo;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456789

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect